[package]
name = "e"
version = "0.1.13"
edition = "2024"

[dependencies]
fxhash = "0.2"
regex-lite = "0.1"
rustix = { version = "1.1.4", features = ["runtime", "termios"] }

[dev-dependencies]
rustybench = "0.1"
vt100 = "0.15"
proptest = "1"
# Dev-only tooling: `examples/gen_xsh.rs` parses the XSH registry source with
# `syn` to regenerate src/xsh_lang.rs; `tests/xsh_lang.rs` verifies freshness.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[[bench]]
name = "bench"
harness = false

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
