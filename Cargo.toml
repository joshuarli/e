[package]
name = "e"
version = "0.1.13"
edition = "2024"

[dependencies]
fxhash = "0.2"
termion = "4"
regex-lite = "0.1"
rustix = { version = "1.1.4", features = ["runtime"] }

[dev-dependencies]
divan = "0.1.21"
vt100 = "0.15"
proptest = "1"

[[bench]]
name = "bench"
harness = false

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
